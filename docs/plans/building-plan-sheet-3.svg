<text x="20" y="268" font-size="1.7" style="fill:#555">Not to scale. Doubler, front and back pulled forward/back; sides, top and bottom pulled out; cleats pulled in. Biscuit slots shown on the visible faces.</text>
<text x="215" y="28" font-size="3.0">ASSEMBLY</text>
<text x="215" y="35" font-size="1.9">1</text>
<text x="220" y="35" font-size="1.9">Cut and check.</text>
<text x="245" y="35" font-size="1.9">Cut all panels from one 2000 × 1000 board (cutting plan in the build guide).</text>
<text x="245" y="38.6" font-size="1.9">The front sets the box square — check its diagonals.</text>
<text x="215" y="43.4" font-size="1.9">2</text>
<text x="220" y="43.4" font-size="1.9">Holes.</text>
<text x="245" y="43.4" font-size="1.9">Ø94 and Ø70 in the front, Ø70 in the doubler, Ø12 and 16 × Ø4.5 in the back.</text>
<text x="215" y="48.2" font-size="1.9">3</text>
<text x="220" y="48.2" font-size="1.9">Seal.</text>
<text x="245" y="48.2" font-size="1.9">Two coats of thinned lacquer on all inside faces before assembly — OSB is porous.</text>
<text x="215" y="53" font-size="1.9">4</text>
<text x="220" y="53" font-size="1.9">Cleats.</text>
<text x="245" y="53" font-size="1.9">Glue to sides, top and bottom, cleat face 23 mm from the rear edge. Jig: back panel</text>
<text x="245" y="56.6" font-size="1.9">on the rear edges, 22 mm offcuts + 1 mm card underneath as spacers.</text>
<text x="215" y="61.4" font-size="1.9">5</text>
<text x="220" y="61.4" font-size="1.9">Biscuit slots.</text>
<text x="245" y="61.4" font-size="1.9">30 per cabinet, size 20 (sheet 2). Reference the joiner from the face, not the</text>
<text x="245" y="65" font-size="1.9">fence; check every slot for voids, shift it 20 mm if hollow. No sealer in the slots.</text>
<text x="215" y="69.8" font-size="1.9">6</text>
<text x="220" y="69.8" font-size="1.9">Carcass.</text>
<text x="245" y="69.8" font-size="1.9">Size the cut edges with thin PVA, let it tack, then glue sides, top and bottom with</text>
<text x="245" y="73.4" font-size="1.9">biscuits, strap-clamped. A back dry-fitted on wax paper holds it square.</text>
<text x="215" y="78.2" font-size="1.9">7</text>
<text x="220" y="78.2" font-size="1.9">Front.</text>
<text x="245" y="78.2" font-size="1.9">Glue the front on with its 18 biscuits — ratchet strap and cauls across the front.</text>
<text x="215" y="83" font-size="1.9">8</text>
<text x="220" y="83" font-size="1.9">Doubler.</text>
<text x="245" y="83" font-size="1.9">Flush with the bottom edge, 20 mm in from each side; a Ø70 offcut through both</text>
<text x="245" y="86.6" font-size="1.9">port holes locates it.</text>
<text x="215" y="91.4" font-size="1.9">9</text>
<text x="220" y="91.4" font-size="1.9">Seal and tube.</text>
<text x="245" y="91.4" font-size="1.9">Glue fillet or acrylic in every inside corner. Tube 151 mm with 20 mm flaps,</text>
<text x="245" y="95" font-size="1.9">butted against the inside of the front, four flaps screwed (3.5 × 12), joint sealed.</text>
<text x="215" y="99.8" font-size="1.9">10</text>
<text x="220" y="99.8" font-size="1.9">Finish.</text>
<text x="245" y="99.8" font-size="1.9">Sand 80 then 120 only — the resin-rich chips sand harder than the binder.</text>
<text x="245" y="103.4" font-size="1.9">Then 2–3 coats of clear water-based lacquer.</text>
<text x="215" y="108.2" font-size="1.9">11</text>
<text x="220" y="108.2" font-size="1.9">Inserts.</text>
<text x="245" y="108.2" font-size="1.9">Clamp the back on, drill through its holes into the cleats, set the M4 inserts.</text>
<text x="215" y="113" font-size="1.9">12</text>
<text x="220" y="113" font-size="1.9">Close.</text>
<text x="245" y="113" font-size="1.9">Gasket on the cleats, damping, wire driver and terminals, screw the back on.</text>
<text x="215" y="123.8" font-size="3.0">HARDWARE  (pair)</text>
<text x="215" y="130.8" font-size="1.9">2</text>
<text x="245" y="130.8" font-size="1.9">Aiyima 4" full-range driver, 8 Ω (plan: Fostex FE103NV2)</text>
<text x="215" y="134.4" font-size="1.9">2 × 151 mm</text>
<text x="245" y="134.4" font-size="1.9">HT pipe DN75 (75 o.d. / ≈ 71 i.d.)</text>
<text x="215" y="138" font-size="1.9">60</text>
<text x="245" y="138" font-size="1.9">biscuits, size 20 — carcass, no screws</text>
<text x="215" y="141.6" font-size="1.9">32</text>
<text x="245" y="141.6" font-size="1.9">M4 threaded inserts, for hardwood</text>
<text x="215" y="145.2" font-size="1.9">32</text>
<text x="245" y="145.2" font-size="1.9">M4 × 30 pan head screws + washers</text>
<text x="215" y="148.8" font-size="1.9">8</text>
<text x="245" y="148.8" font-size="1.9">screws 3.5 × 12 (tube flaps)</text>
<text x="215" y="152.4" font-size="1.9">≈ 3.1 m</text>
<text x="245" y="152.4" font-size="1.9">beech strip 15 × 20 (cleats)</text>
<text x="215" y="156" font-size="1.9">≈ 3.5 m</text>
<text x="245" y="156" font-size="1.9">foam gasket tape 3 × 10 mm</text>
<text x="215" y="159.6" font-size="1.9">2 pairs</text>
<text x="245" y="159.6" font-size="1.9">speaker terminals for Ø12 hole</text>
<text x="215" y="163.2" font-size="1.9"></text>
<text x="245" y="163.2" font-size="1.9">sheep's wool fleece ≈ 10 mm + 2 × 50 g polyester fill</text>
<text x="215" y="166.8" font-size="1.9"></text>
<text x="245" y="166.8" font-size="1.9">PVA glue, clear lacquer, acrylic sealant, wire</text>
<text x="215" y="176.4" font-size="3.0">BEFORE YOU PLAY</text>
<text x="215" y="183.4" font-size="1.9">The Aiyima 4" is rated 25 W; the plan's FE103NV2 only 5 W.</text>
<text x="215" y="187" font-size="1.9">Port 175 mm ≈ 48 Hz: bass flat to ≈ 55 Hz free-standing, −3 dB at 47 Hz.</text>
<text x="215" y="190.6" font-size="1.9">With a DSP, set a protective high-pass at ≈ 0.75 × Fb (36 Hz).</text>
<text x="215" y="194.2" font-size="1.9">Start at a low level — below the port tuning the cone is unloaded.</text>
<rect x="10" y="10" width="400" height="277" class="o"/>
<rect x="283" y="252" width="127" height="35" class="o"/>
<text x="286" y="260.5" font-size="5.5">Le Petit</text>
<text x="325" y="260.5" font-size="2.4">after Jean Hiraga</text>
<text x="286" y="265.5" font-size="1.8">L'Audiophile no. 29 (1983) · hole positions after R. Berchtold (2022)</text>
<text x="286" y="269.5" font-size="1.8">22 mm OSB · biscuits (size 20) + wood glue, no screws · removable back</text>
<text x="286" y="275" font-size="2.5">Assembly and hardware</text>
